    question: "Koľko času má eMSP na odpoveď v reálnom čase, kým Hub použije Whitelist?"
    owner: "BA-Hub"
    blocks: ["R-02"]
    status: "closed"
  - id: "OQ-02"
    question: "Čo znamená „zmysluplné trvanie“ session pri validácii CDR?"
    owner: "BA-Hub"
    blocks: ["R-04"]
    status: "closed"
  - id: "OQ-03"
    question: "Blokuje Suspension Membera iba jeho Tokeny (rola eMSP), alebo aj sessions na jeho nabíjačkách (rola CPO)?"
    owner: "BA-Finance"
    blocks: ["R-03"]
    status: "closed"
